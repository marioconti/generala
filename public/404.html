<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Generala</title>
    <script>
      // GitHub Pages serves this file for any unknown path under /generala/.
      //
      // A tag written with a stray character dead-ends here: a trailing space
      // becomes %20 and the URL stops resolving. Rather than showing GitHub's
      // 404 to someone who just tapped their phone on a table, send them to
      // the app. The hash is preserved so a deep link still lands where it meant to.
      var target = '/generala/' + (location.hash || '')
      if (location.pathname !== '/generala/') location.replace(target)
    </script>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #0d4229;
        color: #e8c877;
        font-family: ui-monospace, monospace;
        font-size: 13px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    ABRIENDO LA PLANILLA…
  </body>
</html>
